# Jeepay 本地 Docker 开发环境（简化版，不包含前端 UI）
# 使用方式：docker compose -f docker-compose.local.yml up -d

services:
  mysql:
    hostname: mysql
    container_name: jeepay-mysql
    restart: always
    # 使用阿里云 ACR 镜像，国内拉取速度快
    image: registry.cn-hangzhou.aliyuncs.com/jeequan/mysql:8.0
    platform: linux/amd64
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: "rootroot"
      MYSQL_DATABASE: "jeepaydb"
      MYSQL_USER: "jeepay"
      MYSQL_PASSWORD: "jeepay"
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mysql:/var/lib/mysql
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docs/sql/patch.sql:/docker-entrypoint-initdb.d/02-patch.sql:ro
    networks:
      - jeepay

  rocketmq-namesrv:
    platform: linux/amd64
    image: ${ROCKETMQ_IMAGE:-swr.cn-south-1.myhuaweicloud.com/jeepay/rocketmq:5.3.1}
    hostname: rocketmq-namesrv
    container_name: jeepay-rocketmq-namesrv
    restart: always
    user: "0:0"
    ports:
      - "9876:9876"
    environment:
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9876'"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 40s
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    networks:
      - jeepay

  rocketmq-broker:
    platform: linux/amd64
    image: ${ROCKETMQ_IMAGE:-swr.cn-south-1.myhuaweicloud.com/jeepay/rocketmq:5.3.1}
    hostname: rocketmq-broker
    container_name: jeepay-rocketmq-broker
    restart: always
    user: "0:0"
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10911'"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 120s
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
      - ./docker/rocketmq/broker/conf/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro
    networks:
      - jeepay

  redis:
    platform: linux/amd64
    hostname: redis
    container_name: jeepay-redis
    restart: always
    # 使用阿里云 ACR 镜像，国内拉取速度快
    image: ${REDIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/jeequan/redis:6.2.14}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - redis:/data
    networks:
      - jeepay

  payment:
    build:
      context: ./jeepay-payment
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: eclipse-temurin:17-jre
    image: jeepay-payment:latest
    hostname: payment
    container_name: jeepay-payment
    restart: always
    ports:
      - "9216:9216"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9216"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    volumes:
      - ./logs/payment:/jeepayhomes/service/logs
      - ./conf/payment/application.yml:/jeepayhomes/service/app/application.yml
    networks:
      - jeepay

  manager:
    build:
      context: ./jeepay-manager
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: eclipse-temurin:17-jre
    image: jeepay-manager:latest
    hostname: manager
    container_name: jeepay-manager
    restart: always
    ports:
      - "9217:9217"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9217"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    volumes:
      - ./logs/manager:/jeepayhomes/service/logs
      - ./conf/manager/application.yml:/jeepayhomes/service/app/application.yml
    networks:
      - jeepay

  merchant:
    build:
      context: ./jeepay-merchant
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: eclipse-temurin:17-jre
    image: jeepay-merchant:latest
    hostname: merchant
    container_name: jeepay-merchant
    restart: always
    ports:
      - "9218:9218"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9218"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    volumes:
      - ./logs/merchant:/jeepayhomes/service/logs
      - ./conf/merchant/application.yml:/jeepayhomes/service/app/application.yml
    networks:
      - jeepay

  ui-payment:
    build:
      context: ${UI_BASE_DIR:-..}/jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: cashier
    image: jeepay-ui-payment:latest
    hostname: payment-ui
    container_name: jeepay-ui-payment
    restart: always
    environment:
      - BACKEND_HOST=payment:9216
    ports:
      - "9226:80"
    depends_on:
      payment:
        condition: service_healthy
    networks:
      - jeepay

  ui-manager:
    build:
      context: ${UI_BASE_DIR:-..}/jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: manager
    image: jeepay-ui-manager:latest
    hostname: manager-ui
    container_name: jeepay-ui-manager
    restart: always
    environment:
      - BACKEND_HOST=manager:9217
    ports:
      - "9227:80"
    depends_on:
      manager:
        condition: service_healthy
    networks:
      - jeepay

  ui-merchant:
    build:
      context: ${UI_BASE_DIR:-..}/jeepay-ui
      dockerfile: Dockerfile
      args:
        PLATFORM: merchant
    image: jeepay-ui-merchant:latest
    hostname: merchant-ui
    container_name: jeepay-ui-merchant
    restart: always
    environment:
      - BACKEND_HOST=merchant:9218
    ports:
      - "9228:80"
    depends_on:
      merchant:
        condition: service_healthy
    networks:
      - jeepay

networks:
  jeepay:
    driver: bridge

volumes:
  mysql:
  redis:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:
